# Драйвер шины событий: `local` для работы внутри одного процесса или `nats`
# для доставки событий между несколькими узлами через JetStream.
# Env: EVENT_BUS_DRIVER
driver = "local"

[nats]

# Адреса серверов NATS. В переменной окружения указываются через запятую.
# Env: NATS_SERVERS
servers = ["nats://127.0.0.1:4222"]

# Уникальный и стабильный идентификатор realtime-узла. Используется как имя
# durable consumer-а и как область дедупликации событий этого узла.
# Env: APP_NODE_ID
node_id = "realtime-local-1"

[nats.stream]

# Имя JetStream stream-а. Оно должно быть уникальным в пределах NATS-кластера.
# Env: NATS_STREAM_NAME
name = "MXT_REALTIME_EVENTS"

# Максимальное количество сообщений, одновременно хранящихся в stream-е.
# Env: NATS_STREAM_MAX_MESSAGES
max_messages = 100000

# Максимальный размер одного сообщения в байтах.
# Env: NATS_STREAM_MAX_MESSAGE_SIZE_BYTES
max_message_size_bytes = 1048576

# Максимальный суммарный размер сообщений stream-а в байтах.
# Env: NATS_STREAM_MAX_BYTES
max_bytes = 1073741824

# Максимальное время хранения сообщения в stream-е, в секундах.
# Env: NATS_STREAM_MAX_AGE_SECONDS
max_age_seconds = 86400

# Количество реплик stream-а в NATS-кластере. Допустимое значение: от 1 до 5.
# Env: NATS_STREAM_REPLICAS
replicas = 1

# Время, в течение которого JetStream отклоняет повторную публикацию с тем же
# `Nats-Msg-Id`, в секундах.
# Env: NATS_STREAM_DUPLICATE_WINDOW_SECONDS
duplicate_window_seconds = 120

[nats.consumer]

# Время ожидания ACK после доставки сообщения, в секундах. После его истечения
# JetStream может доставить сообщение повторно.
# Env: NATS_CONSUMER_ACK_WAIT_SECONDS
ack_wait_seconds = 60

# Максимальное количество доставок одного сообщения с учётом повторных попыток.
# Env: NATS_CONSUMER_MAX_DELIVER
max_deliver = 5

# Задержка перед повторной доставкой после временной ошибки обработки, в секундах.
# Env: NATS_CONSUMER_RETRY_DELAY_SECONDS
retry_delay_seconds = 5

[nats.processing]

# Максимальное время выполнения обработчика одного события, в секундах.
# Env: EVENT_BUS_PROCESSING_TIMEOUT_SECONDS
timeout_seconds = 20

# Время действия исключительного права узла на обработку события, в секундах.
# Значение должно быть больше `timeout_seconds` и меньше `ack_wait_seconds`.
# Env: EVENT_BUS_LEASE_TTL_SECONDS
lease_ttl_seconds = 30

# Время хранения отметки об успешно обработанном событии, в секундах. Пока
# отметка существует, повторная доставка распознаётся как дубликат.
# Env: EVENT_BUS_COMPLETED_RECORD_TTL_SECONDS
completed_record_ttl_seconds = 86400
