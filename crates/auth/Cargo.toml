[package]
name = "auth"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
axum = "0.8.9"
api-response = { path = "../api-response" }
support = { path = "../support" }
tracing = "0.1.44"
argon2 = { version = "0.5.3", features = ["std"] }
redis-client = { path = "../redis-client" }
getrandom = "0.3"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
jsonwebtoken = {
    version = "11",
    default-features = false,
    features = ["rust_crypto"]
}