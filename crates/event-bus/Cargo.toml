[package]
name = "event-bus"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
support = { path = "../support" }
thiserror = "2"
tokio = { version = "1.52.3", features = ["time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt", "sync", "test-util"] }
