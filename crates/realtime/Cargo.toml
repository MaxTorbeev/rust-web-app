[package]
name = "realtime"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_repr = "0.1"
serde_json = "1"
axum = { version = "0.8.9", features = ["ws"] }
auth = { path = "../auth" }
api-response = { path = "../api-response" }
support = { path = "../support" }
event-bus = { path = "../event-bus" }
tracing = "0.1.44"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1.52.3", features = ["sync", "rt", "macros", "time"] }
futures-util = "0.3"
validator = { version = "0.20", features = ["derive"] }
redis-client = { path = "../redis-client" }
getrandom = "0.3"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"