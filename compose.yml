name: mxt-realtime

services:
  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    init: true

    command:
      - -js
      - -sd
      - /data/jetstream
      - -m
      - "8222"

    volumes:
      - nats-data:/data

    security_opt:
      - no-new-privileges:true

  app:
    image: ${APP_IMAGE:-mxt-realtime:local}

    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped
    init: true

    env_file:
      - .env

    environment:
      APP_URL: 0.0.0.0:4008
      APP_TLS_ENABLED: "false"

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      NATS_SERVERS: ${NATS_SERVERS:-nats://nats:4222}

    ports:
      - "127.0.0.1:4008:4008"

    depends_on:
      nats:
        condition: service_started
      redis:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.2.8-alpine
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

    volumes:
      - redis-data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    security_opt:
      - no-new-privileges:true

  otel-collector:
    image: otel/opentelemetry-collector:0.157.0
    restart: unless-stopped
    init: true

    command:
      - --config=/etc/otelcol/config.yaml

    configs:
      - source: otel-collector-config
        target: /etc/otelcol/config.yaml

    expose:
      - "4317"
      - "4318"

    security_opt:
      - no-new-privileges:true

configs:
  otel-collector-config:
    content: |
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

      processors:
        batch:

      exporters:
        debug:
          verbosity: basic

      service:
        pipelines:
          traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [debug]
          metrics:
            receivers: [otlp]
            processors: [batch]
            exporters: [debug]
          logs:
            receivers: [otlp]
            processors: [batch]
            exporters: [debug]

volumes:
  redis-data:
  nats-data:
