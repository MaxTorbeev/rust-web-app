user nginx;
worker_processes 1;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_x_forwarded_proto $upstream_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    upstream realtime_app {
        server app:4008;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        client_max_body_size 2m;

        location = /chat {
            return 308 /chat/;
        }

        location /chat/assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location /chat/ {
            root /usr/share/nginx/html;
            index index.html;
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ =404;
        }

        location / {
            proxy_pass http://realtime_app;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}
