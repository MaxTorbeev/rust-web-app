name: Deploy production

on:
  push:
    branches:
      - master

  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

      - name: Install Rust
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup default 1.94.1

      - name: Run tests
        run: cargo test --workspace --locked

  build:
    name: Build and publish image
    needs:
      - test

    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.value }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="${repository}:${GITHUB_SHA}"

          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          echo "value=${image}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true

          tags: |
            ${{ steps.image.outputs.value }}
            ${{ steps.image.outputs.repository }}:production

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application

  deploy:
    name: Deploy to server
    needs:
      - build

    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: Staging

    permissions:
      contents: read
      packages: read

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}

      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

      APP: ${{ vars.APP }}
      APP_ENV: ${{ vars.APP_ENV }}
      APP_AUTH_LOGIN: ${{ vars.APP_AUTH_LOGIN }}
      APP_REALTIME_API_KEY: ${{ secrets.APP_REALTIME_API_KEY }}
      APP_AUTH_PASSWORD_HASH: ${{ secrets.APP_AUTH_PASSWORD_HASH }}

      IMAGE: ${{ needs.build.outputs.image }}
      DEPLOY_DIRECTORY: mxt-realtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"

          printf '%s\n' "$DEPLOY_SSH_KEY" \
            > "$HOME/.ssh/deploy_key"

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Prepare production environment
        shell: bash
        run: |
          environment_file="$RUNNER_TEMP/production.env"
          
          install -m 600 /dev/null "$environment_file"
          
          for variable_name in \
            APP \
            APP_ENV \
            REDIS_PASSWORD \
            APP_REALTIME_API_KEY \
            APP_AUTH_LOGIN \
            APP_AUTH_PASSWORD_HASH
          do
            if [ -z "${!variable_name:-}" ]; then
              echo "::error::${variable_name} is not configured"
              exit 1
            fi
          done
          
          printf 'APP=%s\n' "$APP" \
            >> "$environment_file"
          
          printf 'APP_ENV=%s\n' "$APP_ENV" \
            >> "$environment_file"
          
          printf 'RUST_LOG=%s\n' "${RUST_LOG:-info}" \
            >> "$environment_file"
          
          printf 'REDIS_PASSWORD=%s\n' "$REDIS_PASSWORD" \
            >> "$environment_file"
          
          printf 'APP_REALTIME_API_KEY=%s\n' "$APP_REALTIME_API_KEY" \
            >> "$environment_file"
          
          printf 'APP_AUTH_LOGIN=%s\n' "$APP_AUTH_LOGIN" \
            >> "$environment_file"
          
          printf "APP_AUTH_PASSWORD_HASH='%s'\n" "$APP_AUTH_PASSWORD_HASH" \
            >> "$environment_file"
          
          printf 'APP_IMAGE=%s\n' "$IMAGE" \
            >> "$environment_file"

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ${{ runner.temp }}/frontend-dist

      - name: Package frontend artifact
        shell: bash
        run: |
          tar \
            --create \
            --gzip \
            --file "$RUNNER_TEMP/frontend-dist.tar.gz" \
            --directory "$RUNNER_TEMP/frontend-dist" \
            .

      - name: Create deployment directory
        shell: bash
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_DIRECTORY/deploy/nginx'"

      - name: Upload deployment files
        shell: bash
        run: |
          scp \
            -i "$HOME/.ssh/deploy_key" \
            -P "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            compose.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIRECTORY/compose.yml"

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -P "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            deploy/install-node-identity.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIRECTORY/deploy/install-node-identity.sh"

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -P "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            deploy/nginx/default.conf.template \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIRECTORY/deploy/nginx/default.conf.template"

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -P "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/frontend-dist.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIRECTORY/frontend-dist.tar.gz"

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -P "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/production.env" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIRECTORY/.env"

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu
             chmod 600 '$DEPLOY_DIRECTORY/.env'
             chmod 0755 '$DEPLOY_DIRECTORY/deploy/install-node-identity.sh'
             '$DEPLOY_DIRECTORY/deploy/install-node-identity.sh' '$DEPLOY_DIRECTORY'"

      - name: Log server in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            ssh \
              -i "$HOME/.ssh/deploy_key" \
              -p "$DEPLOY_PORT" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker login ghcr.io \
                --username '$GITHUB_ACTOR' \
                --password-stdin"

      - name: Deploy containers
        shell: bash
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu
             cd '$DEPLOY_DIRECTORY'

             frontend_release='frontend/releases/$GITHUB_SHA'

             mkdir -p \"\$frontend_release/chat\"
             chmod 0755 . frontend frontend/releases \"\$frontend_release\" \"\$frontend_release/chat\"
             tar \
               --extract \
               --gzip \
               --file frontend-dist.tar.gz \
               --directory \"\$frontend_release/chat\"

             docker compose \
               --env-file .env \
               config --quiet

             docker compose \
               --env-file .env \
               pull

             docker compose \
               --env-file .env \
               up \
               --detach \
               --no-build \
               --remove-orphans \
               --wait \
               --wait-timeout 180

             docker compose \
               --env-file .env \
               ps

             ln -sfn 'releases/$GITHUB_SHA' frontend/current.next
             mv -Tf frontend/current.next frontend/current
             rm -f frontend-dist.tar.gz

             docker image prune --all --force --filter \"until=168h\""
